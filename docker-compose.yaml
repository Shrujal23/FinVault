services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./client
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/}
    depends_on:
      - backend

  backend:
    build: ./server-spring
    environment:
      SERVER_PORT: 4000
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fintech_portfolio}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:?MYSQL_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      AUTH_RETURN_RESET_TOKEN: ${AUTH_RETURN_RESET_TOKEN:-false}
      ALPHAVANTAGE_BASE: ${ALPHAVANTAGE_BASE:-https://www.alphavantage.co/query}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      COINGECKO_BASE: ${COINGECKO_BASE:-https://api.coingecko.com/api/v3}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      NSE_BASE: ${NSE_BASE:-https://www.nseindia.com}
      BSE_BASE: ${BSE_BASE:-https://api.bseindia.com}
      YAHOO_SEARCH_BASE: ${YAHOO_SEARCH_BASE:-https://query2.finance.yahoo.com}
      YAHOO_QUOTE_BASE: ${YAHOO_QUOTE_BASE:-https://query1.finance.yahoo.com}
      NEWS_DEBUG: "false"
      RATE_LIMIT_TRUST_X_FORWARDED_FOR: "true"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fintech_portfolio}
      MYSQL_USER: ${MYSQL_USERNAME:?MYSQL_USERNAME is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data: